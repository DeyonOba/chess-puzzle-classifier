# @package _global_
# The bounded laptop protocol on the BASE-plane v2 file (18 planes), for comparison with the default
# attack-map planes (experiment=bounded_laptop on puzzle_boards_v2x.h5). Results in README "Attack-map input planes".
defaults:
  - bounded_laptop
tags: ["bounded", "laptop", "base_planes"]
data:
  h5_path: ${paths.data_dir}/puzzle_boards_v2.h5
model:
  labels_path: ${paths.data_dir}/puzzle_metadata_v2.json
  net:
    in_planes: 18
