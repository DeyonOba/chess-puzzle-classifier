_target_: src.data.puzzle_datamodule.PuzzleDataModule
h5_path: ${paths.data_dir}/puzzle_boards_v2.h5      # v2 = 69 labels (crushing+advantage -> winning), 18 base planes; v2x = +8 attack-map planes
